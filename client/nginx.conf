server {
    listen 80;

    # Where Nginx will look for our built React files
    root /usr/share/nginx/html;
    
    # What file to serve by default
    index index.html;

    # 1. Handle React Router (Navigation)
    # If a user goes to /dashboard, Nginx won't find a file called "dashboard".
    # So we tell it to fallback to index.html, letting React handle the routing in the browser!
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Handle API requests (Backend)
    # If the URL starts with /api, forward it to our Flask container
    # "api" will be the name of the backend service in our docker-compose.yml
    location /api {
        proxy_pass http://api:5008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
